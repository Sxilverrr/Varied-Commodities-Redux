modLoader = "javafml"
loaderVersion = "[4,)"
license = "CC BY-NC 3.0"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Noppes, Sxilverr"
description = '''A modern port of Varied Commodities by Noppes'''
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "architectury"
type = "required"
versionRange = "${architectury}"
ordering = "AFTER"
side = "BOTH"
