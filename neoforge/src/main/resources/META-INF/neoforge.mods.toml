modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC BY-NC 3.0"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Noppes, Sxilverr"
description = '''A modern port of Varied Commodities by Noppes'''
iconFile = "assets/${id}/icon.png"
iconBlur = false

[[mixins]]
config = "variedcommoditiesredux.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "architectury"
type = "required"
versionRange = "${architectury}"
ordering = "AFTER"
side = "BOTH"
